                  - 'pure-ethernet-structure-2-0:G_826_TYPE_CSES'
                  - 'pure-ethernet-structure-2-0:G_826_TYPE_UAS'
                  - 'pure-ethernet-structure-2-0:G_826_TYPE_NOT_SPECIFIED'
